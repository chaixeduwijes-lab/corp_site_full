name: Check vest-smr.ru

# Ручная проверка «что видно снаружи»: DNS домена, ответ сайта и дайджест
# новостей. Полезно, когда с локальной машины сайт не проверить.
on:
  workflow_dispatch:
  # токен интеграции не может дёргать workflow_dispatch — проверка
  # запускается пушем маркер-файла .check-site (echo N > .check-site)
  push:
    branches: ["main"]
    paths:
      - ".check-site"
      - ".github/workflows/check-site.yml"

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: DNS + HTTP + news.json
        run: |
          echo "===== DNS ====="
          getent hosts vest-smr.ru || echo "vest-smr.ru не резолвится"
          getent hosts www.vest-smr.ru || echo "www.vest-smr.ru не резолвится"

          echo "===== GET / ====="
          curl -sS -m 20 -D /tmp/hdr -o /tmp/body http://vest-smr.ru/ || echo "запрос не удался"
          cat /tmp/hdr 2>/dev/null || true
          echo "--- первые байты ответа ---"
          head -c 600 /tmp/body 2>/dev/null || true
          echo

          echo "===== GET /data/news.json ====="
          curl -sS -m 20 -o /tmp/news -w 'HTTP %{http_code}, %{size_download} bytes\n' \
            http://vest-smr.ru/data/news.json || echo "запрос не удался"
          head -c 800 /tmp/news 2>/dev/null || true
          echo

          echo "===== HTTPS ====="
          # GET, а не HEAD: старый Django-портал отвечает на HEAD 405-м,
          # и по заголовкам не видно, какой именно сайт занял порт 443
          curl -sS -m 20 -D /tmp/shdr -o /tmp/sbody https://vest-smr.ru/ \
            || echo "HTTPS-запрос не удался"
          head -1 /tmp/shdr 2>/dev/null || true
          echo "--- что отвечает на 443 ---"
          grep -io '<title>[^<]*' /tmp/sbody 2>/dev/null || head -c 300 /tmp/sbody 2>/dev/null || true
          echo

          echo "===== HTTPS www ====="
          curl -sS -m 20 -o /dev/null -w 'HTTP %{http_code}\n' https://www.vest-smr.ru/ \
            || echo "HTTPS-запрос к www не удался"

          echo "===== Итог ====="
          if grep -q 'Мониторинг ИИ' /tmp/sbody 2>/dev/null; then
            echo "OK: на https://vest-smr.ru отвечает новый дашборд"
          else
            echo "ПРОБЛЕМА: порт 443 всё ещё не у дашборда."
            echo "На ВМ (браузерная SSH-консоль Яндекс Клауда) выполните одну команду:"
            echo "  curl -fsSL https://raw.githubusercontent.com/ivchenkoIL/corp_site_full/main/deploy/fix-https.sh | sudo bash"
            exit 1
          fi
