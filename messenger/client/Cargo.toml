[package]
name = "messenger-client"
version = "0.1.0"
edition = "2021"
publish = false
description = "Reference E2EE client for messenger-relay (X3DH + Double Ratchet via vodozemac)"

[dependencies]
# Reuse the relay's canonical request/payload strings so client and server
# cannot drift apart on what gets signed.
messenger-relay = { path = ".." }

anyhow = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures-util = "0.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
vodozemac = "0.10"

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
