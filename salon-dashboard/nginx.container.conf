server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-маршруты (/news, /masters, …) отдаём через index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ежедневно обновляемый дайджест — не кешировать
    location = /data/news.json {
        add_header Cache-Control "no-cache";
    }

    # index.html не кешируем: имена чанков меняются при каждом деплое,
    # иначе браузер будет запрашивать уже удалённые /assets/*.js
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
