# HTTPS-конфигурация. Использование:
# 1. Замените example.ru на ваш домен (2 места ниже + server_name)
# 2. Запустите стек с оверлеем: docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
# Подробная инструкция — в DEPLOY.md

server {
    listen 80;
    server_name example.ru www.example.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name example.ru www.example.ru;
    client_max_body_size 10M;

    ssl_certificate /etc/letsencrypt/live/example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css text/plain application/javascript application/json
               application/xml image/svg+xml font/woff2;
    gzip_vary on;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
