# Конфиг nginx для дашборда салона на vest-smr.ru
# Положить в /etc/nginx/sites-available/vest-smr.conf и включить:
#   sudo ln -s /etc/nginx/sites-available/vest-smr.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS-сертификат после настройки DNS:
#   sudo certbot --nginx -d vest-smr.ru -d www.vest-smr.ru

server {
    listen 80;
    listen [::]:80;
    server_name vest-smr.ru www.vest-smr.ru;

    root /var/www/vest-smr;
    index index.html;

    # SPA: все маршруты (/news, /masters, …) отдаём через index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Статика с хешем в имени — кешируем надолго
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
